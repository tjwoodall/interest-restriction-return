openapi: 3.0.3
info:
  title: Interest Restriction Return
  description: |
    # Support

    - Raise non-technical or platform-related issues with the [Software Development Support Team (SDST)](https://developer.service.hmrc.gov.uk/developer/support).

    - Raise technical issues on the [interest-restriction-return](https://github.com/hmrc/interest-restriction-return/issues) issues page

    # Changelog

    You can find the change log on the [interest-restriction-return](https://github.com/hmrc/interest-restriction-return/wiki) wiki page.
  version: "1.0"
servers:
- url: https://test-api.service.hmrc.gov.uk
  description: Sandbox
- url: https://api.service.hmrc.gov.uk
  description: Production
tags:
- name: Reporting Company
  description: |
    These resources allow software packages to develop functionality that will:

    - Appoint a Reporting Company to act on behalf of the group and file the Interest Restriction Return
    - Revoke an existing Reporting Company to remove them from acting on behalf of the group
- name: Return Submission
  description: |
    These resources allow software packages to develop functionality that will:

    - Allow an appointed Reporting Company to submit a Full Interest Restriction Return
    - Allow an appointed Reporting Company to submit an Abbreviated Interest Restriction Return
paths:
  /organisations/interest-restriction/reporting-company/appoint:
    post:
      tags:
      - Reporting Company
      summary: Appoint a Reporting Company
      description: Request to appoint a Reporting Company that can submit Interest
        Restriction Returns
      operationId: appointAReportingCompany
      parameters:
      - name: Accept
        in: header
        description: "Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning)\
          \ of the API to be used."
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Content-Type
        in: header
        description: "Specifies the format of the request body, which must be JSON."
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/json
      - name: Authorization
        in: header
        description: "An [OAuth 2.0 Bearer Token](/api-documentation/docs/authorisation/user-restricted-endpoints)\
          \ with the `write:interest-restriction-return` scope."
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: Bearer bb7fed3fe10dd235a2ccda3d50fb
      requestBody:
        content:
          application/json:
            schema:
              required:
              - accountingPeriod
              - agentDetails
              - authorisingCompanies
              - declaration
              - isReportingCompanyAppointingItself
              - reportingCompany
              type: object
              properties:
                agentDetails:
                  required:
                  - agentActingOnBehalfOfCompany
                  type: object
                  properties:
                    agentActingOnBehalfOfCompany:
                      type: boolean
                      description: Is an agent acting on behalf of the reporting company
                    agentName:
                      pattern: "^[ -~¡-ÿĀ-ʯḀ-ỿ‐-―‘-‟₠-₿ÅK]{1,160}$"
                      type: string
                      description: Name of the agent where an agent is acting on behalf
                        of the reporting company
                  description: Details of the agent where an agent is submitting on
                    behalf of the reporting company
                reportingCompany:
                  required:
                  - companyName
                  - ctutr
                  - sameAsUltimateParent
                  type: object
                  properties:
                    companyName:
                      pattern: "^[ -~¡-ÿĀ-ʯḀ-ỿ‐-―‘-‟₠-₿ÅK]{1,160}$"
                      type: string
                      description: Name of the reporting company
                    ctutr:
                      pattern: "^[0-9]{10}$"
                      type: string
                      description: Reporting company's Corporation Tax Unique Taxpayer
                        Reference
                    sameAsUltimateParent:
                      type: boolean
                      description: Indicate whether the reporting company is also
                        the ultimate parent company
                  description: Details of the reporting company
                authorisingCompanies:
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: Details of companies authorising the appointment
                  items:
                    title: authorisingCompany
                    required:
                    - companyName
                    - utr
                    type: object
                    properties:
                      companyName:
                        pattern: "^[ -~¡-ÿĀ-ʯḀ-ỿ‐-―‘-‟₠-₿ÅK]{1,160}$"
                        type: string
                        description: Name of authorising company
                      utr:
                        pattern: "^[0-9]{10}$"
                        type: string
                        description: Authorising company's Unique Tax Reference.
                      consenting:
                        type: boolean
                        description: Indicate whether the authorising company agrees
                          to take on the group's restriction in its Corporation Tax
                          return
                    additionalProperties: false
                isReportingCompanyAppointingItself:
                  type: boolean
                  description: Indicate whether the reporting company is appointing
                    itself
                identityOfAppointingCompany:
                  required:
                  - companyName
                  type: object
                  properties:
                    companyName:
                      pattern: "^[ -~¡-ÿĀ-ʯḀ-ỿ‐-―‘-‟₠-₿ÅK]{1,160}$"
                      type: string
                      description: Name of the appointing company.
                    countryOfIncorporation:
                      type: string
                      description: Country of incorporation where the appointing company
                        is not a UK company. A valid ISO 3166-1 2 Alpha Country Code.
                      example: US
                    ctutr:
                      pattern: "^[0-9]{10}$"
                      type: string
                      description: "Where the appointing company is a UK company,\
                        \ the Corporation Tax Unique Taxpayer Reference"
                    legalEntityIdentifier:
                      pattern: "^[0-9A-Z]{18}[0-9]{2}$"
                      type: string
                      description: A Legal Entity Identifier (LEI); format is as per
                        the ISO 17442 standard - 18 uppercase alphabetic or numeric
                        characters followed by 2 numeric characters
                  description: Details of the company appointing the reporting company
                ultimateParentCompany:
                  required:
                  - companyName
                  - isUk
                  type: object
                  properties:
                    isUk:
                      type: boolean
                      description: Indicate whether the ultimate parent company is
                        a UK company
                    companyName:
                      pattern: "^[ -~¡-ÿĀ-ʯḀ-ỿ‐-―‘-‟₠-₿ÅK]{1,160}$"
                      type: string
                      description: Name of the ultimate parent company
                    ctutr:
                      pattern: "^[0-9]{10}$"
                      type: string
                      description: Ultimate parent's Corporation Tax Unique Taxpayer
                        Reference.
                    sautr:
                      pattern: "^[0-9]{10}$"
                      type: string
                      description: Ultimate parent company's self assessment Unique
                        Taxpayer Reference
                    countryOfIncorporation:
                      type: string
                      description: Country of incorporation where the ultimate parent
                        company is not a UK company. A valid ISO 3166-1 2 Alpha Country
                        Code
                      example: US
                    legalEntityIdentifier:
                      pattern: "^[0-9A-Z]{18}[0-9]{2}$"
                      type: string
                      description: A Legal Entity Identifier (LEI); format is as per
                        the ISO 17442 standard - 18 uppercase alphabetic or numeric
                        characters followed by 2 numeric characters
                  description: Details of the ultimate parent company
                accountingPeriod:
                  required:
                  - endDate
                  - startDate
                  type: object
                  properties:
                    startDate:
                      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
                      type: string
                      description: "Start date of the group's period of account, which\
                        \ cannot be before 2016-10-01"
                    endDate:
                      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
                      type: string
                      description: "End date of the group's period of account, which\
                        \ must be within 18 months of the start date"
                  description: The worldwide group's period of account
                declaration:
                  type: boolean
                  description: Statement to confirm the truth of the information given
                    and that the authorising companies listed make up at least 50%
                    of eligible companies in the group
              description: Provides the ability to appoint a reporting company for
                the group
            examples:
              appointReportingCompany:
                description: Appoint Reporting Company
                value:
                  agentDetails:
                    agentActingOnBehalfOfCompany: true
                    agentName: AAgent
                  reportingCompany:
                    companyName: ACompany
                    ctutr: "1123456789"
                    sameAsUltimateParent: true
                  isReportingCompanyAppointingItself: false
                  identityOfAppointingCompany:
                    companyName: BCompany
                    ctutr: "9999999999"
                  authorisingCompanies:
                  - companyName: CCompany
                    utr: "5555555555"
                  accountingPeriod:
                    startDate: 2018-11-01
                    endDate: 2019-12-01
                  declaration: true
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - acknowledgementReference
                type: object
                properties:
                  acknowledgementReference:
                    type: string
                    description: Confirmation of submission with reference number
              examples:
                success:
                  description: Typical response received
                  value:
                    acknowledgementReference: XAIRR00000012345678
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: string
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
                  path:
                    type: string
                    description: The path to the specific node where the error occurs.
                      This can be present only when a single validation error occurs.
                  value:
                    type: object
                    description: The error value. This can be present only when a
                      single validation error occurs.
                    oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: object
                  errors:
                    minItems: 2
                    uniqueItems: true
                    type: array
                    description: A list of multiple errors. This can be present only
                      when multiple validation errors occur.
                    items:
                      required:
                      - code
                      - message
                      type: object
                      properties:
                        code:
                          type: string
                          description: The error code.
                        message:
                          type: string
                          description: The error message.
                        path:
                          type: string
                          description: The path to the specific node where the error
                            occurs.
                        value:
                          description: The error value.
                          oneOf:
                          - type: string
                          - type: number
                          - type: boolean
                          - type: object
                      additionalProperties: false
              examples:
                invalidRequest:
                  description: Invalid request.
                  value:
                    code: INVALID_REQUEST
                    message: Invalid request
                invalidBodyType:
                  description: Expecting text/json or application/json body.
                  value:
                    code: INVALID_BODY_TYPE
                    message: Expecting text/json or application/json body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: string
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
              examples:
                clientOrAgentNotAuthorised:
                  description: The client and/or agent is not authorised.
                  value:
                    code: CLIENT_OR_AGENT_NOT_AUTHORISED
                    message: The client and/or agent is not authorised
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: integer
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
              examples:
                forbidden:
                  description: You are unable to access this service as an individual.
                    This service is only available to individual companies or groups
                    of companies.
                  value:
                    code: 403
                    message: You are unable to access this service as an individual.
                      This service is only available to individual companies or groups
                      of companies.
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: string
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
              examples:
                matchingResourceNotFound:
                  description: Matching resource not found.
                  value:
                    code: MATCHING_RESOURCE_NOT_FOUND
                    message: Matching resource not found
                notFound:
                  description: The requested resource could not be found.
                  value:
                    code: NOT_FOUND
                    message: The requested resource could not be found
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: string
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
              examples:
                invalidAcceptHeader:
                  description: The accept header is missing or invalid.
                  value:
                    code: ACCEPT_HEADER_INVALID
                    message: The accept header is missing or invalid
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                required:
                - code
                - message
                type: object
                properties:
                  code:
                    type: string
                    description: The error code.
                  message:
                    type: string
                    description: The error message.
              examples:
                internalServerError:
                  description: An internal server error occurred.
                  value:
                    code: INTERNAL_SERVER_ERROR
                    message: An internal server error occurred
      deprecated: false
      security:
      - user-restricted:
        - write:interest-restriction-return

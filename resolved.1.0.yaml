  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: The error code.
              message:
                type: string
                description: The error message.
              path:
                type: string
                description: The path to the specific node where the error occurs.
                  This can be present only when a single validation error occurs.
              value:
                type: object
                description: The error value. This can be present only when a single
                  validation error occurs.
                oneOf:
                - type: string
                - type: number
                - type: boolean
                - type: object
              errors:
                minItems: 2
                uniqueItems: true
                type: array
                description: A list of multiple errors. This can be present only when
                  multiple validation errors occur.
                items:
                  required:
                  - code
                  - message
                  type: object
                  properties:
                    code:
                      type: string
                      description: The error code.
                    message:
                      type: string
                      description: The error message.
                    path:
                      type: string
                      description: The path to the specific node where the error occurs.
                    value:
                      description: The error value.
                      oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: object
                  additionalProperties: false
          examples:
            invalidRequest:
              description: Invalid request.
              value:
                code: INVALID_REQUEST
                message: Invalid request
            invalidBodyType:
              description: Expecting text/json or application/json body.
              value:
                code: INVALID_BODY_TYPE
                message: Expecting text/json or application/json body
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: The error code.
              message:
                type: string
                description: The error message.
          examples:
            clientOrAgentNotAuthorised:
              description: The client and/or agent is not authorised.
              value:
                code: CLIENT_OR_AGENT_NOT_AUTHORISED
                message: The client and/or agent is not authorised
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: integer
                description: The error code.
              message:
                type: string
                description: The error message.
          examples:
            forbidden:
              description: You are unable to access this service as an individual.
                This service is only available to individual companies or groups of
                companies.
              value:
                code: 403
                message: You are unable to access this service as an individual. This
                  service is only available to individual companies or groups of companies.
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: The error code.
              message:
                type: string
                description: The error message.
          examples:
            matchingResourceNotFound:
              description: Matching resource not found.
              value:
                code: MATCHING_RESOURCE_NOT_FOUND
                message: Matching resource not found
            notFound:
              description: The requested resource could not be found.
              value:
                code: NOT_FOUND
                message: The requested resource could not be found
    "406":
      description: Not Acceptable
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: The error code.
              message:
                type: string
                description: The error message.
          examples:
            invalidAcceptHeader:
              description: The accept header is missing or invalid.
              value:
                code: ACCEPT_HEADER_INVALID
                message: The accept header is missing or invalid
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: The error code.
              message:
                type: string
                description: The error message.
          examples:
            internalServerError:
              description: An internal server error occurred.
              value:
                code: INTERNAL_SERVER_ERROR
                message: An internal server error occurred
  parameters:
    acceptHeader:
